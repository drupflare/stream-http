name: Build Package

on:
  push:
    branches: [master, feat/*, ver/*, renovate/*]
  pull_request:
    branches: [master, feat/*, ver/*, renovate/*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Run PHP Lint
        run: php tests/lint.php
      - name: Cache Composer Downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-
      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress
      - name: Check Coding Standards
        run: ./vendor/bin/phpcs

  suite:
    name: Wrapper Suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          # STREAM_IS_URL wrappers are gated by allow_url_fopen; the suite asserts it is On
          ini-values: allow_url_fopen=1
          coverage: none
      - name: Run Wrapper Suite
        run: php tests/run-suite.php
